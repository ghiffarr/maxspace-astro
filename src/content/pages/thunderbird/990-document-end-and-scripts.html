const scrambleChars =
  "ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789!@#$%^&*()";
// Function for decrypt effect
function decryptText(el) {
  const original = el.textContent;
  const chars = original.split("");
  let iterations = 0;
  const maxIterations = chars.length + 5;
  const interval = setInterval(() => {
    el.textContent = chars
      .map((ch, i) => {
        if (ch === " ") return " ";
        return i < iterations
          ? chars[i]
          : scrambleChars[Math.floor(Math.random() * scrambleChars.length)];
      })
      .join("");
    iterations++;
    if (iterations > chars.length) clearInterval(interval);
  }, 40);
}

  <script>
const noHover = window.matchMedia("(hover: none)").matches;
var swiper2 = new Swiper(".about-team-swiper.swiper", {
  breakpoints: {
    200: {
      slidesPerView: "auto",
      spaceBetween: 8,
    },
    950: {
      slidesPerView: "2",
      spaceBetween: 8,
    },
  },
});
dragableHandler(swiper2, ".about-team-swiper .drag-pagination");
function dragableHandler(slider, pagination) {
  const track = document.querySelector(pagination);
  const handle = track.querySelector(".drag-button");
  function updateHandle(progress = slider.progress) {
    const maxX = track.offsetWidth - handle.offsetWidth;
    handle.style.left = `${progress * maxX}px`;
  }
  // Update handle on slide move
  slider.on("progress", (_, progress) => updateHandle(progress));
  updateHandle();
  // --- Drag functionality ---
  let isDragging = false;
  function getClientX(e) {
    return e.touches ? e.touches[0].clientX : e.clientX;
  }
  function onDragStart(e) {
    isDragging = true;
    handle.style.transition = "none"; // disable smooth animation while dragging
    document.body.style.userSelect = "none";
  }
  function onDragMove(e) {
    if (!isDragging) return;
    const rect = track.getBoundingClientRect();
    let x = getClientX(e) - rect.left - handle.offsetWidth / 2;
    const maxX = rect.width - handle.offsetWidth;
    x = Math.max(0, Math.min(x, maxX));
    const progress = x / maxX;
    updateHandle(progress);
    slider.setProgress(progress, 0);
  }
  function onDragEnd() {
    isDragging = false;
    handle.style.transition = "left 0.3s ease"; // re-enable smooth animation
    document.body.style.userSelect = "";
  }
  // Mouse events
  handle.addEventListener("mousedown", onDragStart);
  window.addEventListener("mousemove", onDragMove);
  window.addEventListener("mouseup", onDragEnd);
  // Touch events
  handle.addEventListener("touchstart", onDragStart, { passive: true });
  window.addEventListener("touchmove", onDragMove, { passive: true });
  window.addEventListener("touchend", onDragEnd);
}

const casesCard = document.querySelectorAll(".use-cases_card");
casesCard.forEach((each, index) => {
  const list = each.querySelector(".use-cases_card-list-wrapper");
  const button = each.querySelector(".read-more-button");
  const sidebar = each.querySelector(".use-cases_card-sidebar");
  const icon = button.querySelector(".icon.is-2");
  //icon.style.transform = "translate(-50%,-50%) rotateZ(90deg)";
  if (each.classList.contains("is-active")) {
    console.log(index);
    expand(list);
    sidebar.style.background = "rgba(10, 18, 22, 0.6)";
    sidebar.style.backdropFilter = "blur(15px)";
    button.childNodes[0].innerText = "Read Less";
    icon.style.transform = "translate(-50%,-50%) rotateZ(0deg)";
  }
  if (noHover) {
    button.addEventListener("click", () => {
      useCasesAnimation(index);
    });
  } else {
    each.addEventListener("mouseover", () => {
      useCasesAnimation(index);
    });
  }
});
function useCasesAnimation(index) {
  casesCard.forEach((item, itemIndex) => {
    const list = item.querySelector(".use-cases_card-list-wrapper");
    const button = item.querySelector(".read-more-button");
    const sidebar = item.querySelector(".use-cases_card-sidebar");
    const icon = button.querySelector(".icon.is-2");
    // icon.style.transform = "translate(-50%,-50%) rotateZ(90deg)";
    if (itemIndex == index) {
      if (!item.classList.contains("is-active")) {
        item.classList.add("is-active");
        expand(list);
        sidebar.style.background = "rgba(10, 18, 22, 0.6)";
        sidebar.style.transitionDelay = "0s";
        sidebar.style.backdropFilter = "blur(15px)";
        button.childNodes[0].innerText = "Read Less";
        icon.style.transform = "translate(-50%,-50%) rotateZ(0deg)";
      }
    } else {
      if (item.classList.contains("is-active")) {
        collapse(list);
        item.classList.remove("is-active");
        button.childNodes[0].innerText = "Read more";
        sidebar.style.transitionDelay = "0.4s";
        sidebar.style.background = "transparent";
        sidebar.style.backdropFilter = " none";
        icon.style.transform = "translate(-50%,-50%) rotateZ(90deg)";
      }
    }
  });
}
function expand(element) {
  gsap.fromTo(
    element,
    { height: 0 },
    {
      height: "100%",
      duration: 0.5,
      ease: "power2.inOut",
      // onComplete: () => (element.style.height = "auto"),
    }
  );
}
function collapse(element) {
  gsap.to(element, {
    height: 0,
    duration: 0.5,
    ease: "power2.inOut",
  });
}

  <script>
(function () {
  var currentPath = window.location.pathname.replace(/\/$/, "").replace(/\.html$/, "");
  if (currentPath === "" || currentPath === "/index") {
    currentPath = "/index";
  }
  document.querySelectorAll(".nav_menu .nav_menu_link").forEach(function (link) {
    var href = link.getAttribute("href") || "";
    var linkPath;
    try {
      linkPath = new URL(href, window.location.origin).pathname.replace(/\/$/, "").replace(/\.html$/, "");
    } catch (error) {
      return;
    }
    var isCurrent = currentPath !== "/index" && linkPath === currentPath;
    link.classList.toggle("w--current", isCurrent);
    if (isCurrent) {
      link.setAttribute("aria-current", "page");
    } else {
      link.removeAttribute("aria-current");
    }
  });
})();
</script>
