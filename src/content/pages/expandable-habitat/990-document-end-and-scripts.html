  <script>
gsap.registerPlugin(ScrollTrigger);
//===================================================descripted Text=================================================================
//=============================================================================================================================
const scrambleChars =
  "ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789!@#$%^&*()";
// Function for decrypt effect
function decryptText(el) {
  const original = el.textContent;
  const chars = original.split("");
  let iterations = 0;
  const maxIterations = chars.length + 5;
  const interval = setInterval(() => {
    el.textContent = chars
      .map((ch, i) => {
        if (ch === " ") return " ";
        return i < iterations
          ? chars[i]
          : scrambleChars[Math.floor(Math.random() * scrambleChars.length)];
      })
      .join("");
    iterations++;
    if (iterations > chars.length) clearInterval(interval);
  }, 40);
}
// Apply ScrollTrigger to each element
document.querySelectorAll("[cs-element='descripted']").forEach((el) => {
  ScrollTrigger.create({
    trigger: el,
    start: "top 80%", // when element enters 80% from top
    onEnter: () => {
      el.classList.add("active");
      decryptText(el);
    },
    once: true, // run only once
  });
});
const splitTypes = document.querySelectorAll(".is-highlights");
splitTypes.forEach((char, i) => {
  const text = new SplitText(char, { types: ["chars", "words"] });
  gsap.from(text.chars, {
    scrollTrigger: {
      trigger: char,
      start: "-60% 70%",
      end: "-60% 10%",
      scrub: true,
      // markers: true
    },
    opacity: 0.4,
    stagger: 0.1,
  });
});

  <script>
const video = document.querySelector("[cs-element='video-player']");
const playPauseBtn = document.querySelector("[cs-element='play-button']");
const volumeBtn = document.querySelector("[cs-element='volume-button']");
// Play / Pause
playPauseBtn.addEventListener("click", () => {
  if (video.paused) {
    video.play();
    document.querySelector(".pause-icon").style.display = "flex";
    document.querySelector(".play-icon").style.display = "none";
  } else {
    video.pause();
    document.querySelector(".pause-icon").style.display = "none";
    document.querySelector(".play-icon").style.display = "flex";
  }
});
// Volume Toggle (Mute / Unmute)
volumeBtn.addEventListener("click", () => {
  video.muted = !video.muted;
  if (video.muted) {
    document.querySelector(".volume-down").style.display = "flex";
    document.querySelector(".volume-up").style.display = "none";
  } else {
    console.log("test1");
    document.querySelector(".volume-down").style.display = "none";
    document.querySelector(".volume-up").style.display = "flex";
  }
});
</script>
  <script>
(function () {
  var currentPath = window.location.pathname.replace(/\/$/, "").replace(/\.html$/, "");
  if (currentPath === "" || currentPath === "/index") {
    currentPath = "/index";
  }
  document.querySelectorAll(".nav_menu .nav_menu_link").forEach(function (link) {
    var href = link.getAttribute("href") || "";
    var linkPath;
    try {
      linkPath = new URL(href, window.location.origin).pathname.replace(/\/$/, "").replace(/\.html$/, "");
    } catch (error) {
      return;
    }
    var isCurrent = currentPath !== "/index" && linkPath === currentPath;
    link.classList.toggle("w--current", isCurrent);
    if (isCurrent) {
      link.setAttribute("aria-current", "page");
    } else {
      link.removeAttribute("aria-current");
    }
  });
})();
</script>
