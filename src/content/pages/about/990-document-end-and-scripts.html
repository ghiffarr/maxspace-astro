  <script>
gsap.registerPlugin(ScrollTrigger);
//===================================================descripted Text=================================================================
//=============================================================================================================================
const scrambleChars =
  "ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789!@#$%^&*()";
// Function for decrypt effect
function decryptText(el) {
  const original = el.textContent;
  const chars = original.split("");
  let iterations = 0;
  const maxIterations = chars.length + 5;
  const interval = setInterval(() => {
    el.textContent = chars
      .map((ch, i) => {
        if (ch === " ") return " ";
        return i < iterations
          ? chars[i]
          : scrambleChars[Math.floor(Math.random() * scrambleChars.length)];
      })
      .join("");
    iterations++;
    if (iterations > chars.length) clearInterval(interval);
  }, 40);
}
// Apply ScrollTrigger to each element
document.querySelectorAll("[cs-element='descripted']").forEach((el) => {
  ScrollTrigger.create({
    trigger: el,
    start: "top 80%", // when element enters 80% from top
    onEnter: () => {
      el.classList.add("active");
      decryptText(el);
    },
    once: true, // run only once
  });
});
const splitTypes = document.querySelectorAll(".is-highlights");
splitTypes.forEach((char, i) => {
  const text = new SplitText(char, { types: ["chars", "words"] });
  gsap.from(text.chars, {
    scrollTrigger: {
      trigger: char,
      start: "-60% 70%",
      end: "-60% 10%",
      scrub: true,
      // markers: true
    },
    opacity: 0.4,
    stagger: 0.1,
  });
});
</script>

  slidesPerView: "auto",
  spaceBetween: 16,
});
dragableHandler(swiper2, ".about-team-swiper .drag-pagination");
function dragableHandler(slider, pagination) {
  const track = document.querySelector(pagination);
  const handle = track.querySelector(".drag-button");
  function updateHandle(progress = slider.progress) {
    const maxX = track.offsetWidth - handle.offsetWidth;
    handle.style.left = `${progress * maxX}px`;
  }
  // Update handle on slide move
  slider.on("progress", (_, progress) => updateHandle(progress));
  updateHandle();
  // --- Drag functionality ---
  let isDragging = false;
  function getClientX(e) {
    return e.touches ? e.touches[0].clientX : e.clientX;
  }
  function onDragStart(e) {
    isDragging = true;
    handle.style.transition = "none"; // disable smooth animation while dragging
    document.body.style.userSelect = "none";
  }
  function onDragMove(e) {
    if (!isDragging) return;
    const rect = track.getBoundingClientRect();
    let x = getClientX(e) - rect.left - handle.offsetWidth / 2;
    const maxX = rect.width - handle.offsetWidth;
    x = Math.max(0, Math.min(x, maxX));
    const progress = x / maxX;
    updateHandle(progress);
    slider.setProgress(progress, 0);
  }
  function onDragEnd() {
    isDragging = false;
    handle.style.transition = "left 0.3s ease"; // re-enable smooth animation
    document.body.style.userSelect = "";
  }
  // Mouse events
  handle.addEventListener("mousedown", onDragStart);
  window.addEventListener("mousemove", onDragMove);
  window.addEventListener("mouseup", onDragEnd);
  // Touch events
  handle.addEventListener("touchstart", onDragStart, { passive: true });
  window.addEventListener("touchmove", onDragMove, { passive: true });
  window.addEventListener("touchend", onDragEnd);
}
</script>
  <script>
(function () {
  var currentPath = window.location.pathname.replace(/\/$/, "").replace(/\.html$/, "");
  if (currentPath === "" || currentPath === "/index") {
    currentPath = "/index";
  }
  document.querySelectorAll(".nav_menu .nav_menu_link").forEach(function (link) {
    var href = link.getAttribute("href") || "";
    var linkPath;
    try {
      linkPath = new URL(href, window.location.origin).pathname.replace(/\/$/, "").replace(/\.html$/, "");
    } catch (error) {
      return;
    }
    var isCurrent = currentPath !== "/index" && linkPath === currentPath;
    link.classList.toggle("w--current", isCurrent);
    if (isCurrent) {
      link.setAttribute("aria-current", "page");
    } else {
      link.removeAttribute("aria-current");
    }
  });
})();
</script>
